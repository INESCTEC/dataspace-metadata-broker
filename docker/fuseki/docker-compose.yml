services:
    broker-fuseki:
        container_name: fuseki
        #image: registry.gitlab.cc-asp.fraunhofer.de/eis-ids/broker-open/fuseki
        #image: stain/jena-fuseki
        build:
            context: .
            dockerfile: Dockerfile
        restart: unless-stopped
        environment:
        - ADMIN_PASSWORD=test
        ports:
        - "3032:3030"
#        expose:
#            - "3030"
        volumes:
            #- 'broker-fuseki:/fuseki'
            - './fuseki-data:/fuseki'
            - './connectorData.ttl:/fuseki/configuration/connectorData.ttl'
            - './connectorDataTest.ttl:/fuseki/configuration/connectorDataTest.ttl'

networks:
    broker:
        driver: bridge
        
volumes:
    broker-fuseki:

