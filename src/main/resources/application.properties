# Spring Boot will automatically load the properties in an application.properties file for all profiles,
#   and the ones in profile-specific.properties files only for the specified profile

# In order to to use @Value annotation, we recommend that you refer to property names using their canonical form (kebab-case using only lowercase letters).
# This will allow Spring Boot to use the same logic as it does when relaxed binding @ConfigurationProperties.
# For example, @Value("{demo.item-price}") will pick up demo.item-price and demo.itemPrice forms from the application.properties file,
#   as well as DEMO_ITEMPRICE from the system environment. If you used @Value("{demo.itemPrice}") instead, demo.item-price and DEMO_ITEMPRICE would not be considered.

# File 'user.properties' is a user-specific file, not commmitted too the git repo
# The order an import is defined inside a single document within the properties/yaml file does not matter.
# The values from user.properties' file will take precedence over the file that triggered its import.
#spring.config.import=optional:file:./user.properties

logging.level.root=info
logging.level.pt.inesctec.ids.broker=debug
logging.level.pt.inesctec.ids.broker.messaging.DescriptionRequestMessageHandler=debug


logging.level.application=info
logging.level.ch.qos.logback=error
logging.level.org.apache=info
logging.level.org.hibernate=info
logging.level.org.springframework.boot=info
logging.level.org.springframework.core=info
logging.level.org.springframework.context=info
logging.level.org.springframework.beans=info
logging.level.org.springframework.data=info
logging.level.org.springframework.web=info
logging.level.org.apache.camel=info
logging.level.org.springframework.security=info
logging.level.org.springframework.test=info

# In the linux system, have this in the .bashrc: 'export TZ="Europe/Lisbon"'
# https://www.baeldung.com/java-jvm-time-zone
logging.pattern.dateformat=yyyy-MM-dd HH:mm:ss.SSS

## Spring Tomcat
server.port=8082
server.error.include-stacktrace=never

## General Information
spring.application.name=@project.name@

Broker.title=@project.name@
Broker.description=@project.description@
Broker.version=@project.version@

## Spring deserialization
spring.jackson.deserialization.fail-on-unknown-properties=true

## Spring Security
# Authentication for the REST API
spring.security.user.name=admin
spring.security.user.password=password

server.error.whitelabel.enabled=true

## OpenAPI
springdoc.swagger-ui.path=/api-docs
springdoc.api-docs.path=/v3/api/docs
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.doc-expansion= none
springdoc.writer-with-default-pretty-printer=true

####################################################################################################
## IDS Properties                                                                                 ##
####################################################################################################

## Configuration Properties
configuration.path=conf/configmodel.json
#/tmp/conf/configmodel.json
configuration.keyStorePassword=password
configuration.keyAlias=1
configuration.trustStorePassword=password

# DAPS
daps.url=https://vcese19.inesctec.pt/auth
daps.token.url=https://vcese19.inesctec.pt/auth/token
daps.whitelisted.url=https://daps.aisec.fraunhofer.de,https://vcese19.inesctec.pt
daps.key.url=https://vcese19.inesctec.pt/auth/jwks.json
daps.incoming.dat.default.wellknown=/jwks.json
daps.enable.log.jwt=true

# Enable or disable DAT claim referringConnector vs IDS message issuerConnector validation.
# Should be turned on in public and production environments.
referred.check=false

## Messaging Services settings
daps.mode=aisec
shacl.validation=true
messaging.log.incoming=false
messaging.log.outgoing=true

## Clearing House
# clearing.house.url=https://ch-ids.aisec.fraunhofer.de
clearing.house.path.process=process
clearing.house.path.log=messages/log

## Connector Settings
policy.negotiation=true
policy.allow-unsupported-patterns=false
policy.framework=INTERNAL
# policy.framework=MYDATA

## Camel
camel.springboot.main-run-controller=true
camel.xml-routes.directory=classpath:camel-routes
camel.truststore.path=classpath:conf/truststore.p12

camel.application.error-handler=errorHandler

## IDSCP
application.http.base-url=http://localhost:8082
idscp2.enabled=false
idscp2.keystore=./src/main/resources/conf/vcese19.inesctec.pt.p12
idscp2.truststore=./src/main/resources/conf/truststore.p12

####################################################################################################
## Storage                                                                                        ##
####################################################################################################

# Fuseki configuration
fuseki.server=http://localhost:3032

# Dataset name in Fuseki
fuseki.datasetName=connectorData

# Fuseki Username
fuseki.username=admin

# Fuseki Password
fuseki.password=test

# Fuseki configuration
broker.catalog.uri=http://localwslhost:8082/connectors/

####################################################################################################
## HTTP/S                                                                                         ##
####################################################################################################

# server.http2.enabled=true
spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER

## TLS
server.ssl.enabled=false
server.ssl.key-store-type=PKCS12
server.ssl.key-store=classpath:conf/vcese19.inesctec.pt.p12
server.ssl.key-store-password=password
server.ssl.key-alias=1
server.ssl.key-password=password
#security.require-ssl=true

## MULTIPART (MultipartProperties)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=215MB

## Timeout settings (millis)
http.timeout.connect=10000
http.timeout.read=10000
http.timeout.write=10000
http.timeout.call=10000

httptrace.enabled=false


####################################################################################################
## Spring Security settings                                                                       ##
####################################################################################################

## Enable default spring security settings, e.g. use Basic Authentication
spring.security.enabled=true
